name: Conda

on:
    push:
        branches:
            - "**"
        tags:
            - "v*.*.*"

permissions:
    contents: read

env:
    CARGO_TERM_COLOR: always

jobs:
    build-conda:
        strategy:
            fail-fast: false
            matrix:
                include:
                    - os: ubuntu-latest
                      platform: linux-64
                    - os: macos-latest
                      platform: osx-arm64
                    - os: windows-2025
                      platform: win-64
        runs-on: ${{ matrix.os }}
        steps:
            - uses: actions/checkout@v7
            - uses: prefix-dev/setup-pixi@v0
              with:
                  pixi-version: v0.82.0
                  environments: packaging

            - name: Build and test conda package
              shell: bash
              run: |
                  pixi run --locked -e packaging conda-build
                  pixi run --locked -e packaging conda-test
                  pixi run --locked -e packaging conda-channel-test

            - name: Checkout conda channel
              if: startsWith(github.ref, 'refs/tags/v')
              uses: actions/checkout@v7
              with:
                  repository: VITO-RMA/conda-channel
                  ref: main
                  path: conda/channel
                  token: ${{ secrets.CONDA_CHANNEL_TOKEN }}

            - name: Publish package directly to conda channel
              if: startsWith(github.ref, 'refs/tags/v')
              shell: bash
              env:
                  RELEASE_TAG: ${{ github.ref_name }}
              run: |
                  git -C conda/channel config user.name 'github-actions[bot]'
                  git -C conda/channel config user.email '41898282+github-actions[bot]@users.noreply.github.com'
                  for attempt in 1 2 3 4 5; do
                    # Reindex from the latest channel tip when another platform wins the push race.
                    git -C conda/channel fetch origin main
                    git -C conda/channel reset --hard FETCH_HEAD
                    pixi run --locked -e packaging conda-channel-update --packages conda/output --channel conda/channel
                    git -C conda/channel add --all
                    if git -C conda/channel diff --cached --quiet; then
                      echo "Channel is already up to date"
                      exit 0
                    fi
                    git -C conda/channel commit -m "Publish sas-raster-tools $RELEASE_TAG"
                    if git -C conda/channel push origin HEAD:main; then
                      exit 0
                    fi
                    if [ "$attempt" -lt 5 ]; then
                      sleep "$((attempt * 2))"
                    fi
                  done
                  echo "::error::Failed to publish conda package after five attempts"
                  exit 1
