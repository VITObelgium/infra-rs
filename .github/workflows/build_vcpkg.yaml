name: Vcpkg build
on: [push]

permissions:
    contents: read
    packages: write

jobs:
    compile:
        name: ${{ matrix.cfg.id }}
        runs-on: ${{ matrix.cfg.os }}
        strategy:
            fail-fast: false
            matrix:
                cfg:
                    - {
                          id: windows,
                          os: windows-2025,
                          triplet: x64-windows-static-release,
                          target: x86_64-pc-windows-msvc,
                      }

        env:
            VCPKG_BINARY_SOURCES: "clear;nuget,https://nuget.pkg.github.com/${{ github.repository_owner }}/index.json,readwrite"
            VCPKG_NUGET_REPOSITORY: ${{ github.server_url }}/${{ github.repository }}.git

        steps:
            - name: Enable Git long paths
              run: git config --system core.longpaths true
            - uses: actions/checkout@v7
            - uses: jdx/mise-action@v5
              with:
                  cache_key: "mise-{{platform}}-{{file_hash}}"
            - name: Install NuGet
              uses: NuGet/setup-nuget@v2
              with:
                  nuget-version: "6.x"
            - name: Configure vcpkg binary cache credentials
              shell: pwsh
              env:
                  FEED_URL: https://nuget.pkg.github.com/${{ github.repository_owner }}/index.json
                  FEED_USERNAME: ${{ github.repository_owner }}
                  FEED_TOKEN: ${{ secrets.GITHUB_TOKEN }}
              run: |
                  # The vcpkg-acquired NuGet also reads this user-level configuration.
                  nuget sources add -Name GitHubPackages -Source "$env:FEED_URL" -UserName "$env:FEED_USERNAME" -Password "$env:FEED_TOKEN" -StorePasswordInClearText -NonInteractive
                  if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
                  nuget setapikey "$env:FEED_TOKEN" -Source "$env:FEED_URL" -NonInteractive
                  if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            - name: Build the C++ dependencies using vcpkg
              run: mise -E vcpkg run bootstrap --target ${{ matrix.cfg.target }} --triplet ${{ matrix.cfg.triplet }}

            - name: Install the python environment with pixi
              env:
                MISE_GITHUB_SLSA: "false"
              if: matrix.cfg.id != 'mac-intel'
              run: mise -E vcpkg run bootstrap_py
            - name: Build the project
              run: mise -E vcpkg run build_ci --release --target ${{ matrix.cfg.target }}
            - name: Run the unit tests
              run: mise -E vcpkg run test_ci --release --target ${{ matrix.cfg.target }}
            - name: Run the integration tests
              run: mise -E vcpkg run test_integration --release --target ${{ matrix.cfg.target }}
            - name: Run the unit tests with python feature enabled
              run: mise -E vcpkg run test_py
            - name: Archive build logs
              if: ${{ failure() }}
              uses: actions/upload-artifact@v7
              with:
                  name: ${{ matrix.cfg.id }}-build-logs
                  path: |
                      target/vcpkg/buildtrees/**/autoconf*.log
                      target/vcpkg/buildtrees/**/config*.log
                      target/vcpkg/buildtrees/**/build*.log
                      target/vcpkg/buildtrees/**/install*.log
                      target/vcpkg/buildtrees/**/package*.log
