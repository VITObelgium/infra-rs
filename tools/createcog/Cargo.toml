[package]
name = "createcog"
version.workspace = true  # inherit from [workspace.package]
edition.workspace = true
rust-version.workspace = true

[package.metadata.vcpkg]
dependencies = ["gdal[core,netcdf]"]

[dependencies]
anyhow = "1.0"
bytemuck = "1.25"
chrono = "0.4"
clap = { version = "4.6", features = ["derive"] }
env_logger = { version = "0.11" }
gdal = "0.19"
gdal-sys = "0.12"
glob = "0.3"
geo = { path = "../../crates/geo", default-features = false, features = [
  "gdal",
  "raster-io-geotiff",
  "rayon",
] }
inf = { path = "../../crates/inf", features = [] }
kdam = { version = "0.6", features = ["rich"] }
log = "0.4"
parking_lot = "0.12"
rayon = "1.12"
strum = { version = "0.28", features = ["derive"] }
tempfile = "3"
thiserror = "2.0"

[features]
default = ["geo/default", "gdal-static"]
gdal-static = ["geo/gdal-static"]
