[package]
name = "tiler"
version.workspace = true
edition.workspace = true

[package.metadata.vcpkg.target]
aarch64-apple-darwin = { dependencies = ["hdf5[core, threadsafe]"] }
x86_64-apple-darwin = { dependencies = ["hdf5[core, threadsafe]"] }
x86_64-unknown-linux-gnu = { dependencies = ["hdf5[core, threadsafe]"] }

[dependencies]
gdal = "0.19"
geo = { path = "../geo", features = ["gdal", "raster-io-geotiff", "serde"] }
geo-types = "0.7"
geozero = { version = "0.15", optional = true }
inf = { path = "../inf", features = ["serde"] }
log = "0.4"
mvt = { version = "0.15", optional = true }
num = "0.4"
png = "0.18"
raster-tile = { path = "../raster-tile" }
serde = { version = "1.0", features = ["derive"], optional = true }
serde_json = { version = "1.0", optional = true }
specta = { version = "=2.0.0-rc.22", features = ["derive"], optional = true }
sqlite = { path = "../sqlite" }
thiserror = "2.0"

[dev-dependencies]
approx = "0.5"
ctor = "1.0"
image = { version = "0.25", default-features = false, features = ["png"] }
path_macro = "1.0"
tempfile = "3"
test-log = "0.2"

[features]
serde = ["dep:serde", "dep:serde_json", "inf/serde"]
simd = ["geo/simd", "inf/simd"]
slow_tests = []
specta = ["dep:specta", "geo/specta", "inf/specta"]
vector-tiles = ["dep:geozero", "dep:mvt", "geo/vector-processing"]
