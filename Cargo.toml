[package]
name = "infra-rs"
edition = "2024"
rust-version = "1.95"

[package.metadata.vcpkg]
dependencies = [
  "proj[core,embed-data]",
  "gdal[core,netcdf,zstd,expat,lerc]",
  "hdf5[core,zlib]",
  "netcdf-c[core,netcdf-4]",
  "tiff[core,lzma,zstd,lerc]",
]  # needed to run the geo tests
git = "https://github.com/microsoft/vcpkg"
overlay-triplets-path = "vcpkg-overlay/triplets"
rev = "66c0373"

[package.metadata.vcpkg.target]
# aarch64-apple-darwin = { triplet = "arm64-osx-debugsymbols" }
# x86_64-pc-windows-msvc = { triplet = "x64-windows-static-debugsymbols" }
x86_64-unknown-linux-gnu = { triplet = "x64-linux-release" }
aarch64-apple-darwin = { triplet = "arm64-osx-release" }
x86_64-apple-darwin = { triplet = "x64-osx-release" }
x86_64-pc-windows-msvc = { triplet = "x64-windows-static-release" }

[workspace]
package.version = "2026.10.29"
package.edition = "2024"
package.rust-version = "1.95"
members = [
  "crates/geo",
  "crates/geo/vector_derive",
  "crates/inf",
  "crates/raster-tile",
  "crates/sqlite",
  "crates/tiler",
  "tools/cog-analyzer",
  "tools/createcog",
  "tools/creatembtiles",
  "tools/tiles2raster",
  "tools/tileserver",
]
default-members = [
  "crates/geo",
  "crates/geo/vector_derive",
  "crates/inf",
  "crates/raster-tile",
  "crates/sqlite",
  "crates/tiler",
]

[dependencies]
geo = { path = "./crates/geo" }
inf = { path = "./crates/inf" }
pyo3 = { version = "*", optional = true }
sqlite = { path = "./crates/sqlite", optional = true }
tiler = { path = "./crates/tiler", optional = true }
tileserver = { path = "./tools/tileserver", optional = true }

[features]
default = ["cog", "gdal-static", "serde", "sqlite"]
allocate = ["geo/allocate"]
arrow = ["geo/arrow"]
cog = ["geo/deflate", "geo/raster-io-geotiff"]
gdal = ["geo/gdal"]
gdal-static = ["gdal", "geo/gdal-static"]
python = ["pyo3/auto-initialize"]
serde = ["inf/serde"]
sqlite = ["dep:sqlite"]
tiler = ["dep:tiler"]
tui = ["tileserver/tui"]
vector = ["geo/vector-io", "geo/vector-io-csv", "geo/vector-io-xlsx"]

[patch.crates-io]
# GDAL 3.13 renamed GDT_Byte; use the upstream compatibility fix until released.
# Remove this patch when gdal-rs supports GDAL 3.13 (release 0.20)
gdal = { git = "https://github.com/georust/gdal.git", rev = "c0a6266b987a2c2d44aea9956c2cae1ed71445cf" }
gdal-sys = { git = "https://github.com/georust/gdal.git", rev = "c0a6266b987a2c2d44aea9956c2cae1ed71445cf" }
# https://github.com/image-rs/image-tiff/issues/253
tiff = { git = "https://github.com/dirkvdb/image-tiff.git", rev = "51e31a7ff65e5c63cc404efacc4d2f9db174c773" }

# [profile.dev]
# debug = "line-tables-only"

[profile.dev.package."*"]
debug = false

# [profile.debugging]
# inherits = "dev"
# debug = true

[profile.samply]
inherits = "release"
debug = true
