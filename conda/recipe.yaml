context:
  version: ${{ load_from_file('../Cargo.toml').workspace.package.version }}

package:
  name: sas-raster-tools
  version: ${{ version }}

source:
  path: ..
  filter:
    - Cargo.toml
    - Cargo.lock
    - LICENSE
    - crates/**
    - tools/**
    - src/**

build:
  number: 3
  skip: target_platform == 'osx-64'
  script: build.py

requirements:
  build:
    - ${{ compiler('c') }}
    - ${{ compiler('cxx') }}
    - if: unix
      then: ${{ stdlib('c') }}
    - rust 1.95.*
    - libclang
    - clang
    - python >=3.11
    - if: win
      then: pkgconf
      else: pkg-config
    - git
    - cargo-bundle-licenses
  host:
    - libgdal-core >=3.12,<3.14
    - proj >=9.6.2
    - libsqlite
  run:
    - libgdal-netcdf >=3.12,<3.14

tests:
  - package_contents:
      bin:
        - createcog
        - cog-analyzer
  - script:
      - createcog --help
      - createcog --version
      - cog-analyzer --help
      - cog-analyzer --version
  - script: test_package.py
    requirements:
      run:
        - python >=3.11
        - gdal >=3.12,<3.14

about:
  homepage: https://github.com/VITO-RMA/infra-rs
  repository: https://github.com/VITO-RMA/infra-rs
  license: MIT
  license_file:
    - LICENSE
    - THIRDPARTY.yml
  summary: Raster tools for creating and analyzing Cloud Optimized GeoTIFFs
  description: |
    Contains the createcog command-line executable and cog-analyzer terminal UI,
    built from source against conda-forge GDAL and PROJ. Includes GDAL NetCDF
    input support.
